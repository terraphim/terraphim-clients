name: native-ci
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: terraphim-native
    steps:
      # #118: a duplicate terraphim_* crate makes clippy report
      # `expected ConfigState, found ConfigState`, which reads as a bug in the
      # calling code and is not. Name the real problem before clippy misdescribes it.
      - run: scripts/ci/check-no-duplicate-terraphim.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace --lib --no-fail-fast
      # #95: isolated packaged install-graph regression.
      - run: cargo test -p terraphim_agent --test packaged_install_graph_regression -- --nocapture
      # #112: keep the publish provenance gate working. The gate itself runs at
      # release time, not here -- a branch HEAD is legitimately untagged, so
      # invoking it on every push would always fail. This runs its tests.
      - run: scripts/tests/publish-gate-test.sh
