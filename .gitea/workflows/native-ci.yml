name: native-ci
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: terraphim-native
    env:
      # #313: preset SSL cert env so instrumented subprocesses can reach
      # git.terraphim.cloud over HTTPS (EXP-102 Lead addendum 2).
      # Inherited by every step; see "Check host CA bundle" below.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
    steps:
      # #106: the terraphim_update signed-archive tests shell out to the
      # `zipsign` binary on the host. It is installed at /usr/local/bin/zipsign
      # on bigbox (see "Host Tooling" in gitea-infrastructure HANDOVER.md);
      # runners carry their own CARGO_HOME and do not all have ~/.cargo/bin on
      # PATH, so a user-local install is invisible to them. Fail fast with a
      # pointer to the fix rather than 21 failing test targets.
      - name: Check host tooling (zipsign)
        # Note: the terraphim-gitea-runner command policy inspects the
        # literal first token; `if`/`then`/`fi` shell keywords get rejected.
        # Use `test` (the only conditional primitive on the allowlist) and
        # `||` chaining instead. Refs #106.
        run: |
          test -x /usr/local/bin/zipsign && /usr/local/bin/zipsign --version || { echo "::error::zipsign not found on PATH. Install on the runner host: sudo install -m 0755 ~/.cargo/bin/zipsign /usr/local/bin/zipsign (see gitea-infrastructure HANDOVER.md, 'Host Tooling'). Refs #106"; exit 1; }
      # #313: guard the CA bundle path the workflow just exported.
      # The runner command policy rejects shell `if`/`then`/`fi` as the
      # literal first token; use `test` (the only conditional primitive on
      # the allowlist) with `||` chaining. Never SSL_CERT_FILE=/dev/null.
      - name: Check host CA bundle
        run: |
          test -f "$SSL_CERT_FILE" || { echo "::error::CA bundle not found at $SSL_CERT_FILE (EXP-102). Install ca-certificates on the runner host or set SSL_CERT_FILE to a real path. Refs #313"; exit 1; }
      # #313: install coverage toolchain to /usr/local (mirrors the zipsign
      # precedent above; ~/.cargo/bin is not always on the runner PATH).
      # --locked pins cargo-llvm-cov to the crates.io latest matching the
      # workspace's Cargo.lock hash. Three separate steps so a transient
      # network failure on one install can be retried without rerunning
      # the others; cargo install --locked is idempotent on warm caches.
      - name: Install cargo-llvm-cov (pinned via Cargo.lock)
        run: cargo install cargo-llvm-cov --locked --root /usr/local
      - name: Install cargo-nextest (pinned via Cargo.lock)
        run: cargo install cargo-nextest --locked --root /usr/local
      - name: Add llvm-tools-preview component
        run: rustup component add llvm-tools-preview
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      # #113: build terraphim_server from terraphim-ai so the
      # server-binary-dependent integration tests have a real binary.
      # terraphim_server is not a workspace member here -- it lives in
      # terraphim-ai -- so we install it from the v1.21.3 git tag. The
      # runner's GITEA_TOKEN is already configured for the terraphim
      # cargo registry and doubles as the git credentials.
      # The trailing `terraphim_server` positional arg is the package
      # selector: terraphim-ai is a multi-binary repo (firecracker, dsm,
      # gitea_runner, merge_coordinator, server, eval_check), so cargo
      # refuses --bin without an explicit package.
      # The two --config flags re-declare the workspace registry config
      # (`terraphim` index + `cargo:token` credential provider) because
      # cargo install runs in an isolated context and does NOT inherit
      # the workspace's .cargo/config.toml; without these flags, parsing
      # the cloned manifest fails with "registry index was not found
      # in any configuration: `terraphim`" (run 29280 / job 61814).
      # --locked pins terraphim_automata and terraphim_types to 1.20.2 via
      # the v1.21.3 Cargo.lock; without it the [patch.crates-io] range
      # requirements (1.20.2) match both 1.20.2 and 1.21.0 in the registry
      # and cargo aborts with "patch resolved to more than one candidate".
      - run: cargo install --locked --git https://git.terraphim.cloud/terraphim/terraphim-ai --tag v1.21.3 --root /tmp/terraphim_server_install --config 'registries.terraphim.index="sparse+https://git.terraphim.cloud/api/packages/terraphim/cargo/"' --config 'registry.global-credential-providers=["cargo:token"]' --bin terraphim_server terraphim_server
      # Refs terraphim/terraphim-agents#91: --all-targets exercises binaries,
      # examples, and the integration suite in tests/*.rs. --lib silently
      # excluded those, hiding the 2026-07-31 family of regressions. This step
      # runs after the install above so TERRAPHIM_SERVER_BIN can be exported
      # here too: server_mode_tests, cross_mode_consistency_test,
      # integration_tests and kg_ranking_integration_test all fail without it.
      # Binaries built by this workspace (terraphim-agent, terraphim_mcp_server)
      # are resolved by the tests via CARGO_BIN_EXE_*, so they need no env.
      - run: TERRAPHIM_SERVER_BIN=/tmp/terraphim_server_install/bin/terraphim_server cargo test --workspace --all-targets --no-fail-fast
      # #113: focused re-runs of the integration tests that require a real
      # terraphim_server binary (also covered by --all-targets above; kept for
      # fast failure attribution). ensure_server_binary() (in
      # cross_mode_consistency_test.rs / kg_ranking_integration_test.rs)
      # and server_binary_path() (in integration_tests.rs) both resolve
      # TERRAPHIM_SERVER_BIN first, so pointing the env var at the
      # install root is enough.
      - run: TERRAPHIM_SERVER_BIN=/tmp/terraphim_server_install/bin/terraphim_server cargo test -p terraphim_agent --test cross_mode_consistency_test -- --nocapture
      - run: TERRAPHIM_SERVER_BIN=/tmp/terraphim_server_install/bin/terraphim_server cargo test -p terraphim_agent --test integration_tests -- --nocapture
      - run: TERRAPHIM_SERVER_BIN=/tmp/terraphim_server_install/bin/terraphim_server cargo test -p terraphim_agent --test kg_ranking_integration_test -- --nocapture
      # #2171: enrichment feature clippy + test invocations (feature-gated,
      # not covered by --all-targets with default features).
      - run: cargo clippy -p terraphim_sessions --features enrichment -- -D warnings
      - run: cargo test -p terraphim_sessions --features enrichment --lib --no-fail-fast
      # Refs terraphim-clients#150: cass-parity suite gates (cursor/codex/extras
      # connectors and the search-index score module are invisible to the
      # default-features and enrichment-only lanes above).
      - run: cargo test -p terraphim_sessions --all-features --no-fail-fast
      # #95: isolated packaged install-graph regression (covered by --all-targets
      # above but kept as a focused gate for faster failure attribution).
      - run: cargo test -p terraphim_agent --test packaged_install_graph_regression -- --nocapture
      # #118: repo guards -- duplicate-crate detection and the publish gate's own
      # tests. Rust tests, not shell steps: the runner allowlist rejects any
      # program that is not cargo ("policy rejected command: ... not on the
      # allowlist"), which is what took CI down from #112 until now. Also
      # covered by --all-targets above; kept for fast failure attribution.
      - run: cargo test -p terraphim_agent --test ci_guards -- --nocapture
      # #313: first coverage lane in the monorepo. nextest runs each test
      # binary in its own process so llvm-cov can attribute per-test
      # coverage. --workspace --all-targets mirrors the existing cargo
      # test lane; --no-fail-fast matches it. GITEA_TOKEN is inherited
      # from the runner env so the [patch.crates-io] registry fetch works.
      # #328: the command MUST stay on one line. The runner's policy
      # classifier strips leading VAR=value assignments token-wise
      # (policy::strip_env_assignments); a trailing "\" continuation
      # leaves the backslash as the program name and the entire workflow
      # is rejected before any step runs with
      # "program `\` is not on the allowlist" (renders as an empty
      # program name in the UI).
      - name: Coverage (cargo llvm-cov nextest)
        run: TERRAPHIM_SERVER_BIN=/tmp/terraphim_server_install/bin/terraphim_server cargo llvm-cov nextest --workspace --all-targets --no-fail-fast --lcov --output-path lcov.info
      # #328: the Gitea native runner does not execute `uses:` marketplace
      # steps (workflow/parser.rs skips them), so actions/upload-artifact
      # silently uploads nothing on this lane. Print lcov totals into the
      # run log instead, via the allowlisted repo-script interpreter
      # convention (`bash ./scripts/...`; Refs #118). Restore an artefact
      # upload once the runner supports `uses:` steps
      # (terraphim/gitea-infrastructure#2).
      - name: Coverage summary (lcov totals)
        run: bash ./scripts/ci/lcov_totals.sh lcov.info
