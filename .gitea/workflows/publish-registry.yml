name: publish-registry

on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Crate name to publish (e.g. terraphim_sessions)'
        required: true
        default: 'terraphim_sessions'

jobs:
  publish:
    runs-on: terraphim-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # #400: the runner's command policy inspects the literal first token of
      # every `run:` line and rejects anything that is not on its allowlist. A
      # multi-line block - with comments, shell conditionals or heredocs - is
      # rejected before the first step runs, which is why this workflow could
      # never publish anything. The publish path now lives in a checked-in
      # script (the shape the native-ci lanes use) and the step is one line.
      #
      # The crate name and the registry token arrive through the step's `env:`,
      # never through shell text: the policy strips leading assignments
      # token-wise, and an expression in a `run:` line would be classified as a
      # program.
      #
      # The script writes the registry credentials, refuses the crates
      # terraphim-ai owns, runs the pre-publish gate for terraphim_agent
      # (#516) and then publishes.
      - name: Publish to the terraphim registry
        env:
          CRATE: ${{ github.event.inputs.crate }}
          CARGO_REGISTRIES_TERRAPHIM_TOKEN: ${{ secrets.CARGO_REGISTRIES_TERRAPHIM_TOKEN }}
        run: bash ./scripts/release/publish-registry.sh
