[package]
name = "terraphim_agent"
# Pinned ahead of the workspace: 1.21.1 on the terraphim registry carries the
# broken install set (#95), so published agent releases must stay >= 1.21.2.
# v1.21.12 consolidates canonical main after the divergent v1.21.11 release
# branch (#97).
version.workspace = true
edition.workspace = true
authors = ["Terraphim Contributors"]
description = "Terraphim AI Agent CLI - Command-line interface with interactive REPL and ASCII graph visualization"
documentation = "https://terraphim.ai"
homepage = "https://terraphim.ai"
repository = "https://github.com/terraphim/terraphim-ai"
keywords = ["cli", "ai", "agent", "search", "repl"]
license = "Apache-2.0"
readme = "README.md"

[features]
default = ["repl-interactive", "llm", "repl-sessions"]
server = ["dep:reqwest", "dep:urlencoding"]
llm = ["terraphim_service/ollama", "terraphim_service/llm_router"]
repl = ["dep:rustyline", "dep:colored", "dep:comfy-table"]
repl-interactive = ["repl"]
repl-full = ["repl", "repl-chat", "repl-mcp", "repl-file", "repl-custom", "repl-web", "repl-interactive", "repl-sessions", "llm", "server"]
repl-chat = ["repl", "llm"]
repl-mcp = ["repl"]
repl-file = ["repl"]
repl-custom = ["repl"]
repl-web = ["repl"]
repl-web-advanced = ["repl-web"]
firecracker = ["repl"]
update-tests = []
repl-sessions = ["repl", "dep:terraphim_sessions"]
enrichment = ["repl-sessions", "terraphim_sessions/enrichment"]
shared-learning = ["terraphim_middleware/feedback-loop", "terraphim_rolegraph/kg-integration", "terraphim_types/kg-integration"]
	grepapp = ["terraphim_middleware/grepapp"]
	jmap = ["terraphim_middleware/jmap"]
	cross-agent-injection = ["shared-learning"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
ratatui = "0.30"
crossterm = "0.29"
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
reqwest = { workspace = true, optional = true }
tracing = { workspace = true }

tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
log = { workspace = true }
urlencoding = { version = "2.1", optional = true }
ahash = "0.8"
terraphim_update = { path = "../terraphim_update", version = "1.0.0" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1.12"
glob = "0.3"
async-trait = { workspace = true }
chrono = { workspace = true }
jiff = { version = "0.2", features = ["serde"] }
strsim = "0.11"  # For edit distance / fuzzy matching in forgiving CLI
uuid = { workspace = true }
dialoguer = "0.12"  # Interactive CLI prompts for onboarding wizard

# REPL dependencies - only compiled with features
rustyline = { version = "17.0", optional = true }
colored = { version = "3.0", optional = true }
comfy-table = { version = "7.0", optional = true }
dirs = { version = "5.0" }
directories = "5.0"
terraphim_types = { version = "1.21.0", registry = "terraphim" }
terraphim_settings = { version = "1.0.0" }
terraphim_persistence = { version = "1.0.0" }
terraphim_config = { version = "1.0.0" }
terraphim_command_runtime = { path = "../terraphim_command_runtime", version = "0.1.0" }
terraphim_automata = { version = "1.21.0", registry = "terraphim" }
terraphim_service = { version = "1.21.1", default-features = false, registry = "terraphim" }
# Upstream 1.21.3 moved McpToolIndex here; `mcp_tool_index` is now a deprecated
# re-export shim and lib.rs re-exports the real type. Refs #112.
terraphim_mcp_search = { version = "0.1.3", registry = "terraphim" }
terraphim_middleware = { version = "1.0.0" }
terraphim_rolegraph = { version = "1.0.0" }
terraphim_hooks = { path = "../terraphim_hooks", version = "1.0.0" }
terraphim_tracker = { version = "1.0.0" }
terraphim_orchestrator = { version = "1.0.0" }
# Session search (#95): depend on the canonical terraphim-registry release.
# crates.io only has stale terraphim_sessions (<= 1.21.1, no cursor-connector
# and a broken terraphim-markdown-parser resolution), so the floor is 1.21.2
# from the private registry. Do not use a workspace path here: the exact
# published package is the release artifact being validated.
# Sibling workspace crate: must be a path dep, otherwise the workspace compiles
# two different terraphim_sessions (the local one and a published copy). Refs #112.
terraphim_sessions = { path = "../terraphim_sessions", version = "1.21.2", optional = true, features = ["tsa-full", "aider-connector", "cursor-connector", "search-index"] }

[dev-dependencies]
assert_cmd = "2"
proptest = "1"
serial_test = "3.3"
futures = "0.3"
portpicker = "0.1"
reqwest = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
wiremock = "0.6"

terraphim_test_utils = { version = "1.20.3" }
insta = { version = "1.41", features = ["yaml", "redactions"] }
# Packaged-install-graph regression test (#95)
toml = "0.8"
semver = "1"

# Enable REPL features for testing
terraphim_agent = { path = ".", features = ["repl-full"] }

[build-dependencies]
rustc_version = "0.4"


[[bin]]
name = "terraphim-agent"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "Terraphim Contributors <team@terraphim.ai>"
copyright = "2024, Terraphim Contributors"
license-file = ["../../LICENSE-Apache-2.0", "4"]
extended-description = """
Terraphim Agent - AI Agent CLI Interface for Terraphim.
Command-line interface with interactive REPL and ASCII graph visualization.
Supports search, configuration management, and data exploration."""
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    ["target/release/terraphim-agent", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/terraphim-agent/README", "644"],
]
