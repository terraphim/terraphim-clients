name: Release MCP Server
run-name: Release ${{ inputs.tag || github.ref_name }}${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && ' (dry run)' || '' }}

# Narrow pre-release workflow for terraphim_mcp_server only (design AC11, step
# 7). The tag pattern does not match the `v*` trigger used elsewhere and this
# workflow is independent of release-binaries.yml.
#
# Every build job runs on the self-hosted runners: GitHub-hosted runners cannot
# download crates from the private Terraphim registry (off-tailnet requests are
# Bearer-only and cargo sends no Bearer on .crate downloads, Gitea #341). See
# release-binaries.yml for the host preconditions of the release-linux and
# release-macos runners. Windows is not built: there is no self-hosted Windows
# runner.
#
# Assets are raw binaries named terraphim_mcp_server-<target> plus
# terraphim_mcp_server-universal-apple-darwin and a checksums.txt produced by
# `sha256sum -- *` over exactly those files.

on:
  push:
    tags:
      - "terraphim_mcp_server-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, terraphim_mcp_server-v<version>
        required: true
        type: string
      dry_run:
        description: Build and assemble assets but do not create the release
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-mcp-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate tag and crate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.contract.outputs.version }}
      crate_version: ${{ steps.contract.outputs.crate_version }}
      source_sha: ${{ steps.contract.outputs.source_sha }}
      dry_run: ${{ steps.tag.outputs.dry_run }}
    steps:
      - name: Resolve tag and mode
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            dry_run="$INPUT_DRY_RUN"
          else
            tag="$REF_NAME"
            dry_run=false
          fi
          [[ "$tag" =~ ^terraphim_mcp_server-v[0-9A-Za-z.+-]+$ ]] || {
            echo "tag '$tag' is not terraphim_mcp_server-v<version>" >&2
            exit 1
          }
          {
            echo "tag=$tag"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag version against the crate version
        id: contract
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          .github/scripts/release-mcp/check-tag.py "$TAG" "$RUNNER_TEMP/metadata.json" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require the tagged commit to be on main before any self-hosted job
        # Cargo build scripts and proc macros run arbitrary code on the
        # self-hosted runners with the registry token, so only reviewed code
        # that reached main may be built.
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.contract.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "tagged commit $SOURCE_SHA is not an ancestor of origin/main" >&2
            exit 1
          }
      - name: Refuse to publish over an existing release
        if: steps.tag.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "a release for $TAG already exists; delete it deliberately before retrying" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, Linux, X64, release-linux]
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: [self-hosted, Linux, X64, release-linux]
            target: x86_64-unknown-linux-musl
            use_cross: true
          - os: [self-hosted, Linux, X64, release-linux]
            target: aarch64-unknown-linux-musl
            use_cross: true
          - os: [self-hosted, macOS, ARM64, release-macos]
            target: x86_64-apple-darwin
            use_cross: false
          - os: [self-hosted, macOS, ARM64, release-macos]
            target: aarch64-apple-darwin
            use_cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - name: Assert clean exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.source_sha }}"
          test -z "$(git status --porcelain)"
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --target "${{ matrix.target }}"
      - name: Install cross
        if: matrix.use_cross
        run: >-
          rustup run 1.96.0 cargo install cross --locked
          --git https://github.com/cross-rs/cross
          --rev 88f49ff79e777bef6d3564531636ee4d3cc2f8d2
      - name: Install QEMU for supported foreign execution
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
      - name: Prove Rosetta for x86_64 verification on Apple Silicon
        if: runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          arch -x86_64 /usr/bin/true 2>/dev/null || \
            sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true
      - name: Build terraphim_mcp_server from the locked source
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_REGISTRIES_TERRAPHIM_TOKEN: ${{ secrets.CARGO_REGISTRIES_TERRAPHIM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            # The self-hosted runner's shared ~/.cargo/config.toml sets a
            # host-only rustc-wrapper that does not exist inside cross
            # containers, and concurrent containers must not share cargo's
            # on-disk caches: give each lane a CARGO_HOME of its own whose
            # config omits the wrapper (same pattern as release-binaries.yml).
            lane_cargo="${RUNNER_TEMP:-/tmp}/cargo-mcp-${{ matrix.target }}"
            mkdir -p "$lane_cargo/registry" "$lane_cargo/git"
            sed '/rustc-wrapper/d' /home/alex/.cargo/config.toml > "$lane_cargo/config.toml"
            export CARGO_HOME="$lane_cargo"
            unset RUSTC_WRAPPER
            build=(rustup run 1.96.0 cross)
          else
            build=(rustup run 1.96.0 cargo)
          fi
          "${build[@]}" build --locked --release --target "${{ matrix.target }}" \
            -p terraphim_mcp_server --bin terraphim_mcp_server
          git diff --exit-code -- Cargo.toml Cargo.lock
          test -z "$(git status --porcelain)"
      - name: Verify binary architecture and reported version
        shell: bash
        env:
          CRATE_VERSION: ${{ needs.preflight.outputs.crate_version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          path="target/$TARGET/release/terraphim_mcp_server"
          test -s "$path"
          test -x "$path"
          scripts/validate_release_binary.py "$TARGET" "$path"
          case "$TARGET" in
            aarch64-unknown-linux-musl) output="$(qemu-aarch64-static "$path" --version)" ;;
            x86_64-apple-darwin) output="$(arch -x86_64 "$path" --version)" ;;
            aarch64-apple-darwin) output="$(arch -arm64 "$path" --version)" ;;
            *) output="$("$path" --version)" ;;
          esac
          reported="$(printf '%s\n' "$output" | tail -n1 | awk '{print $NF}')"
          [ "$reported" = "$CRATE_VERSION" ] || {
            echo "reported $reported, expected $CRATE_VERSION" >&2
            exit 1
          }
      - name: Collect the raw binary without byte mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir raw
          cp "target/${{ matrix.target }}/release/terraphim_mcp_server" \
            "raw/terraphim_mcp_server-${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-binary-${{ matrix.target }}
          path: raw/*
          if-no-files-found: error
          overwrite: false

  universal-macos:
    name: Create universal macOS binary
    needs: [preflight, build]
    runs-on: [self-hosted, macOS, ARM64, release-macos]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mcp-binary-x86_64-apple-darwin
          path: x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mcp-binary-aarch64-apple-darwin
          path: aarch64
      - name: Create and validate the universal binary
        shell: bash
        env:
          CRATE_VERSION: ${{ needs.preflight.outputs.crate_version }}
        run: |
          set -euo pipefail
          mkdir universal
          out=universal/terraphim_mcp_server-universal-apple-darwin
          lipo -create \
            x86_64/terraphim_mcp_server-x86_64-apple-darwin \
            aarch64/terraphim_mcp_server-aarch64-apple-darwin \
            -output "$out"
          chmod 755 "$out"
          # The input file must precede -verify_arch with Xcode 16.4 lipo.
          lipo "$out" -verify_arch x86_64 arm64
          scripts/validate_release_binary.py universal-apple-darwin "$out"
          reported="$("$out" --version | tail -n1 | awk '{print $NF}')"
          [ "$reported" = "$CRATE_VERSION" ] || {
            echo "reported $reported, expected $CRATE_VERSION" >&2
            exit 1
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-binary-universal-apple-darwin
          path: universal/*
          if-no-files-found: error
          overwrite: false

  assemble:
    name: Assemble assets and checksums
    needs: [preflight, build, universal-macos]
    # Needs no registry: stays on a GitHub-hosted runner. Read-only, no
    # persisted credentials, because it runs repository-controlled scripts.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mcp-binary-*
          path: downloaded
      - name: Assemble the six assets and checksums.txt
        run: .github/scripts/release-mcp/assemble-assets.sh downloaded release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-release-assets-${{ needs.preflight.outputs.tag }}
          path: |
            release/assets/*
            release/checksums.txt
          if-no-files-found: error
          overwrite: false
      - name: Report dry run
        if: needs.preflight.outputs.dry_run == 'true'
        run: echo 'Dry run, assets assembled and uploaded as a workflow artefact, no release created.'

  publish:
    name: Publish the pre-release
    needs: [preflight, assemble]
    if: needs.preflight.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    # The only job with write access. It checks out nothing and runs no
    # repository-controlled code: it publishes the already assembled artefact.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mcp-release-assets-${{ needs.preflight.outputs.tag }}
          path: release
      - name: Create a draft, verify the remote assets, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A draft never becomes visible half-uploaded: it is published only
          # after the remote asset list matches the local files exactly.
          gh release create "$TAG" release/assets/* release/checksums.txt \
            --repo "$REPO" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "$TAG" \
            --notes "terraphim_mcp_server pre-release. Raw binaries per target and checksums.txt (sha256sum)."
          want="$( (cd release/assets && printf '%s\n' *; echo checksums.txt) | LC_ALL=C sort)"
          have="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          [ "$want" = "$have" ] || {
            echo "remote assets differ from the local set; the draft release is left for inspection" >&2
            printf 'want:\n%s\nhave:\n%s\n' "$want" "$have" >&2
            exit 1
          }
          gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease
