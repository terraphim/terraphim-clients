name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # #313: preset SSL cert env. ubuntu-latest's default bundle lives at
  # this path; presetting is harmless and uniform with native-ci.yml.
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # #313: install cargo-llvm-cov and cargo-nextest via taiki-e's
      # install-action, pinned to the v2 action tag and specific tool
      # versions so a transitive regression on the crates we depend on
      # cannot silently flip the coverage lane (matches the
      # cargo install --locked discipline on the native lane). The pin
      # values must match the locally-installed toolchain on the dev box;
      # coverage_tool_pinning_matches_local_toolchain in
      # crates/terraphim_agent/tests/ci_guards.rs fires if they drift.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@v0.8.5,nextest@v0.9.144
      - uses: Swatinem/rust-cache@v2
      # #313: guard the CA bundle path the workflow just exported. Same
      # shape as the native lane (test -f ... || { echo ::error::...; exit 1; })
      # but with the ubuntu-latest default bundle path. cargo-llvm-cov
      # installs llvm-tools-preview via rustup on first run.
      - name: Check host CA bundle
        run: |
          test -f "$SSL_CERT_FILE" || { echo "::error::CA bundle not found at $SSL_CERT_FILE (EXP-102). Install ca-certificates on the runner host or set SSL_CERT_FILE to a real path. Refs #313"; exit 1; }
      - name: Install release signature verifier
        run: cargo install zipsign --version 0.2.1 --locked
      - name: Release workflow and sealing contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_*release*contract.py' -v
          python3 -m unittest tests.test_build_manifest_contract -v
          python3 -m unittest tests.test_promotion_contract -v
          python3 -m unittest tests.test_package_metadata_contract -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p terraphim_sessions --features enrichment -- -D warnings
      - run: cargo build --workspace
      # #313: the existing --workspace --lib cargo test lane stays in
      # place so the test signal is visible even if the coverage
      # toolchain breaks; the design's "Avoid At All Cost" rule
      # (docs/plans/design-coverage-nextest.md:55) explicitly forbids
      # replacing it.
      - run: cargo test --workspace --lib --no-fail-fast
      # #313: additive coverage lane. nextest runs each test binary in
      # its own process so llvm-cov can attribute per-test coverage;
      # --workspace --lib matches the test lane above; --no-fail-fast
      # matches the prior lane. GH has no Gitea registry creds so --lib
      # is the safe target set.
      - name: Coverage (cargo llvm-cov nextest)
        run: cargo llvm-cov nextest --workspace --lib --no-fail-fast --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov-gh
          path: lcov.info
      - run: cargo test -p terraphim_sessions --features enrichment --lib --no-fail-fast
      # #4325: zero-chunk smoke for terraphim_grep default features.
      - run: cargo test -p terraphim_grep --test default_feature_smoke
      # #95: isolated packaged install-graph regression.
      - run: cargo test -p terraphim_agent --test packaged_install_graph_regression -- --nocapture

  client-packaging-contracts:
    name: Client DEB/RPM packaging producer contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install pinned nFPM
        shell: bash
        env:
          NFPM_VERSION: 2.47.0
          NFPM_ARCHIVE_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
          NFPM_BINARY_SHA256: 17133a2467ffb7cec851c2d7bae0c6098d09d7ed7d3d101a9605f6a473323936
        run: |
          set -euo pipefail
          install_dir="/tmp/nfpm-bin"
          mkdir -p "$install_dir"
          archive="$install_dir/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          url="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL "$url" -o "$archive"
          printf '%s  %s\n' "$NFPM_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$install_dir" nfpm
          printf '%s  %s\n' "$NFPM_BINARY_SHA256" "$install_dir/nfpm" | sha256sum -c -
          mv "$install_dir/nfpm" "$install_dir/nfpm-${NFPM_VERSION}"
          chmod 0755 "$install_dir/nfpm-${NFPM_VERSION}"
          .github/scripts/nfpm/verify-nfpm.sh \
            --binary "$install_dir/nfpm-${NFPM_VERSION}" \
            --version "$NFPM_VERSION" \
            --sha256 "$NFPM_BINARY_SHA256"
      # #326: these suites protect the DEB/RPM managed-package producer's
      # fail-closed properties (arch/version normalization, payload
      # byte-equivalence, receipt contract, lint policy, checksum-manifest
      # round-trip verification, all-or-nothing inventory assembly). Without
      # a CI home a future edit could weaken any of them with no signal.
      # REQUIRE_TOOLS=1 turns every prerequisite SKIP inside these suites
      # into a hard failure so this step can never pass vacuously if nFPM,
      # dpkg-deb, or a C compiler are missing from the runner image.
      - name: Managed package producer contracts (workflow, shell)
        shell: bash
        env:
          NFPM_BIN: /tmp/nfpm-bin/nfpm-2.47.0
          REQUIRE_TOOLS: "1"
        run: |
          set -euo pipefail
          # #326 P1-1: the contract module is unittest-based (unittest.main());
          # invoke it with the stdlib runner directly instead of requiring an
          # undeclared pytest dependency the runner image never installs.
          python3 -m unittest -v tests.test_release_binaries_workflow_contract
          for t in \
            .github/scripts/nfpm/tests/test_client_nfpm.sh \
            .github/scripts/nfpm/tests/test_client_nfpm_arch.sh \
            .github/scripts/nfpm/tests/test_client_nfpm_policy.sh \
            .github/scripts/nfpm/tests/test_client_nfpm_static_lint.sh \
            .github/scripts/nfpm/tests/test_client_nfpm_strip.sh \
            .github/scripts/nfpm/tests/test_verify_nfpm.sh \
            .github/scripts/release/tests/test_assemble_client_release_inventory.sh \
          ; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
