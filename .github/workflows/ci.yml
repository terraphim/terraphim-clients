name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace --lib --no-fail-fast
      # Smoke test - terraphim-grep default features return non-zero chunks
      # Guards terraphim/terraphim-ai#4325: a plain `cargo build`/`cargo install`
      # of terraphim_grep must return chunks for a matching query. Fails loudly
      # if `code-search` is ever removed from the `default` feature set.
      - run: cargo test -p terraphim_grep --test default_feature_smoke
