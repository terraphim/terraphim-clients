name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  reject-fork-pr:
    # A skipped job is not a failed check, so without this a fork PR would look
    # green while the Rust build below never ran. Fail closed instead.
    name: Reject fork PR (Rust CI needs the tailnet runner)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain and fail
        run: |
          echo "Fork PRs cannot run the Rust CI: it needs the tailnet-only cargo registry and runs on a persistent self-hosted host that must not execute fork code."
          echo "A maintainer must push the branch to this repository to get a real run."
          exit 1

  build:
    # Never run fork PR code on the persistent self-hosted host.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Self-hosted: GitHub-hosted runners cannot download crates from the
    # private Terraphim registry (Caddy on bigbox rejects off-tailnet requests
    # without a Bearer header, and cargo sends no token on .crate downloads
    # because the registry advertises auth-required:false). The release-linux
    # runner resolves git.terraphim.cloud over the tailnet, as
    # release-binaries.yml relies on (#366).
    runs-on: [self-hosted, Linux, X64, release-linux]
    # No registry token: the self-hosted runner resolves git.terraphim.cloud over
    # the tailnet, where the registry needs no authentication (see
    # release-binaries.yml), so job steps run without the secret.
    env:
      # The runner is a persistent host: select the toolchain per job through
      # the environment so the host's default toolchain is never changed.
      # RUSTUP_HOME stays shared on purpose: the toolchain is pinned and the
      # step only installs it, so sharing saves a download without letting job
      # code change what other workflows resolve. Everything else mutable is
      # per-run (see "Isolate cargo state").
      RUSTUP_TOOLCHAIN: 1.96.0
      # The host config sets a host-only rustc wrapper; disable it.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Assert clean checkout
        run: test -z "$(git status --porcelain)"
      - name: Isolate cargo state per run
        # PR code (build scripts, proc macros, tests) must not mutate
        # ~/.cargo, which release-binaries.yml also uses on this host. The
        # runner.* context is not available in job-level env, hence this step.
        run: |
          set -euo pipefail
          cargo_home="$RUNNER_TEMP/cargo-home"
          echo "DIAG home=$HOME"; ls -A "$HOME/.cargo" | tr '\n' ' '; echo; env | cut -d= -f1 | sed -n '/CARGO\|RUSTUP\|TERRAPHIM/p' | tr '\n' ' '; echo; sed -E 's/=.*/=/' "$HOME/.cargo/config.toml" | sed '/^$/d' | tr '\n' ' '
          mkdir -p "$cargo_home" "$RUNNER_TEMP/tools/bin"
          # Keep the registry definitions, drop the host-only rustc wrapper.
          if [ -f "$HOME/.cargo/config.toml" ]; then
            sed '/rustc-wrapper/d' "$HOME/.cargo/config.toml" > "$cargo_home/config.toml"
          fi
          # The registry index requires the host's registry credential (cargo
          # reads it from CARGO_HOME). Copy it into the per-run home, which the
          # cleanup step removes; the job never receives the repository secret.
          for credentials in credentials.toml credentials; do
            if [ -f "$HOME/.cargo/$credentials" ]; then
              install -m 0600 "$HOME/.cargo/$credentials" "$cargo_home/$credentials"
            fi
          done
          {
            echo "CARGO_HOME=$cargo_home"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      # No rust-cache: the self-hosted host keeps its own persistent cargo and
      # target caches, and its rustup wrapper prints to stdout, which breaks
      # the action's toolchain detection.
      - name: Install release signature verifier
        # Per-run root: never writes into the shared ~/.cargo/bin.
        run: cargo install zipsign --version 0.2.1 --locked --root "$RUNNER_TEMP/tools"
      - name: Install pinned actionlint
        run: .github/scripts/install-actionlint.sh
      - name: Release workflow and sealing contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_*release*contract.py' -v
          python3 -m unittest tests.test_build_manifest_contract -v
          python3 -m unittest tests.test_promotion_contract -v
          python3 -m unittest tests.test_package_metadata_contract -v
          python3 -m unittest tests.test_manifest_builder_compatibility -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace --lib --no-fail-fast
      # GitHub-side home for the updater integration contracts (managed-mode
      # receipt/refusal, strict v2 manifest readers, R2 checksum fail-closed).
      # On Gitea these lanes live in .gitea/workflows/native-ci.yml, which is
      # intentionally not part of the GitHub port.
      - run: cargo test -p terraphim_update --test manifest --test r2_update --test managed_mode --test policy --no-fail-fast
      - name: Assert the build left the checkout and lockfile untouched
        run: |
          set -euo pipefail
          git diff --exit-code -- Cargo.toml Cargo.lock
          test -z "$(git status --porcelain)"
      - name: Remove per-run state
        if: always()
        run: rm -rf "$RUNNER_TEMP/cargo-home" "$RUNNER_TEMP/target" "$RUNNER_TEMP/tools"

  client-packaging-contracts:
    name: Client DEB/RPM packaging producer contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install pinned nFPM
        shell: bash
        env:
          NFPM_VERSION: 2.47.0
          NFPM_ARCHIVE_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
          NFPM_BINARY_SHA256: 17133a2467ffb7cec851c2d7bae0c6098d09d7ed7d3d101a9605f6a473323936
        run: |
          set -euo pipefail
          install_dir="/tmp/nfpm-bin"
          mkdir -p "$install_dir"
          archive="$install_dir/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          url="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL "$url" -o "$archive"
          printf '%s  %s\n' "$NFPM_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$install_dir" nfpm
          printf '%s  %s\n' "$NFPM_BINARY_SHA256" "$install_dir/nfpm" | sha256sum -c -
          mv "$install_dir/nfpm" "$install_dir/nfpm-${NFPM_VERSION}"
          chmod 0755 "$install_dir/nfpm-${NFPM_VERSION}"
          .github/scripts/nfpm/verify-nfpm.sh \
            --binary "$install_dir/nfpm-${NFPM_VERSION}" \
            --version "$NFPM_VERSION" \
            --sha256 "$NFPM_BINARY_SHA256"
      # #326: these suites protect the DEB/RPM managed-package producer's
      # fail-closed properties (arch/version normalization, payload
      # byte-equivalence, receipt contract, lint policy, checksum-manifest
      # round-trip verification, all-or-nothing inventory assembly). Without
      # a CI home a future edit could weaken any of them with no signal.
      # REQUIRE_TOOLS=1 turns every prerequisite SKIP inside these suites
      # into a hard failure so this step can never pass vacuously if nFPM,
      # dpkg-deb, rpm/rpm2cpio, cpio, or a C compiler are missing from the
      # runner image.
      #
      # #26: rpm2cpio and cpio are NOT on the ubuntu-latest image. Without
      # them verify_rpm falls back to docker_rpm_tool, and the arch regression
      # suite reported "RPM payload extraction failed" even though every
      # payload member extracted cleanly (run 35434267810 assert failed on
      # the missing "RPM arch mismatch" line while the extraction log showed
      # all five members plus "26 blocks"). Provision the host RPM toolchain
      # explicitly so the suite exercises the production host path it is
      # meant to protect, deterministically, against a pinned image.
      - name: Install RPM payload tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm2cpio cpio rpm
          # rpm2cpio has no --version/--help flag: it takes an RPM path as its
          # only argument, so probe for the executable itself. cpio and rpm do
          # support --version and are checked that way.
          command -v rpm2cpio >/dev/null 2>&1 ||
            { echo "rpm2cpio missing after install" >&2; exit 1; }
          cpio --version >/dev/null 2>&1 ||
            { echo "cpio missing after install" >&2; exit 1; }
          rpm --version >/dev/null 2>&1 ||
            { echo "rpm missing after install" >&2; exit 1; }
      - name: Install pinned actionlint
        run: .github/scripts/install-actionlint.sh
      - name: Managed package producer contracts (workflow, shell)
        shell: bash
        env:
          NFPM_BIN: /tmp/nfpm-bin/nfpm-2.47.0
          REQUIRE_TOOLS: "1"
        run: |
          set -euo pipefail
          # #326 P1-1: the contract module is unittest-based (unittest.main());
          # invoke it with the stdlib runner directly instead of requiring an
          # undeclared pytest dependency the runner image never installs.
          python3 -m unittest -v tests.test_release_binaries_workflow_contract
          for t in \
            .github/scripts/nfpm/tests/test_client_nfpm.sh \
            .github/scripts/nfpm/tests/test_client_nfpm_arch.sh \
            .github/scripts/nfpm/tests/test_client_nfpm_policy.sh \
            .github/scripts/nfpm/tests/test_client_nfpm_static_lint.sh \
            .github/scripts/nfpm/tests/test_client_nfpm_strip.sh \
            .github/scripts/nfpm/tests/test_verify_nfpm.sh \
            .github/scripts/release/tests/test_assemble_client_release_inventory.sh \
          ; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
