name: R2 manifest health

# Read-only migration-aware validation. Legacy stable.json remains healthy
# below 1.21.15; stable-v2.json is mandatory once legacy reaches 1.21.15.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate migration state, schemas, targets, sizes, and SHA-256
        run: >-
          scripts/validate-r2-manifests.py
          --base-url https://downloads.terraphim.ai
          --activation-version 1.21.15
