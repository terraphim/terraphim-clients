name: Release Client Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (e.g. 1.20.5)'
        required: true
        type: string
      release_tag:
        description: 'GitHub release tag (e.g. v1.20.5)'
        required: true
        type: string
      source_ref:
        description: 'Release source ref to resolve and checkout (must equal release_tag)'
        required: true
        type: string
      expected_source_sha:
        description: 'Expected peeled 40-character source commit SHA'
        required: true
        type: string
      target_repo:
        description: 'GitHub repo to attach binaries to'
        required: false
        default: terraphim-clients
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Validate release source contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.contract.outputs.version }}
      release_tag: ${{ steps.contract.outputs.release_tag }}
      source_ref: ${{ steps.contract.outputs.source_ref }}
      source_sha: ${{ steps.contract.outputs.source_sha }}
      target_repo: ${{ steps.contract.outputs.target_repo }}
    steps:
      - name: Validate inputs and peel source tag
        id: contract
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os, re, sys

          version = os.environ["VERSION"]
          release_tag = os.environ["RELEASE_TAG"]
          source_ref = os.environ["SOURCE_REF"]
          expected_source_sha = os.environ["EXPECTED_SOURCE_SHA"]
          target_repo = os.environ["TARGET_REPO"]

          semver = re.compile(
              r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)"
              r"(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?"
              r"(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$"
          )
          if not semver.fullmatch(version):
              sys.exit(f"input version {version!r} is not valid semver")
          if release_tag != f"v{version}":
              sys.exit(f"release_tag {release_tag!r} must equal 'v' plus version {version!r}")
          if source_ref != release_tag:
              sys.exit(f"release_tag {release_tag!r} must equal source_ref {source_ref!r}")
          if not re.fullmatch(r"[0-9a-f]{40}", expected_source_sha):
              sys.exit(
                  f"expected_source_sha {expected_source_sha!r} is not a 40-character lowercase hex SHA"
              )
          if target_repo not in {"terraphim-clients", "terraphim-ai"}:
              sys.exit(f"target_repo {target_repo!r} is not allowed")
          PY

          peel_tag_ref() {
            local ref_name="$1"
            local ref_json object_sha object_type tag_json

            ref_json="$(gh api "repos/${{ github.repository }}/git/ref/tags/${ref_name}")"
            object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            object_type="$(jq -r '.object.type' <<<"$ref_json")"

            # Recursively peel annotated tags until the object is a commit: while object_type != "commit".
            while [ "$object_type" != "commit" ]; do
              if [ "$object_type" != "tag" ]; then
                echo "ERROR: ref '$ref_name' resolved to unsupported object type '$object_type'" >&2
                exit 1
              fi
              tag_json="$(gh api "repos/${{ github.repository }}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type' <<<"$tag_json")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
            done

            printf '%s\n' "$object_sha"
          }

          source_sha="$(peel_tag_ref "$SOURCE_REF")"

          if [ "$source_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "ERROR: peeled source SHA '$source_sha' does not match expected_source_sha '$EXPECTED_SOURCE_SHA'" >&2
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "release_tag=$RELEASE_TAG"
            echo "source_ref=$SOURCE_REF"
            echo "source_sha=$source_sha"
            echo "target_repo=$TARGET_REPO"
          } >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build client binaries for ${{ matrix.target }}
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted Linux: terraphim-ai self-hosted runners are repo-scoped.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            use_cross: true
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
    runs-on: ${{ matrix.os }}
    env:
      CARGO_REGISTRIES_TERRAPHIM_TOKEN: ${{ secrets.CARGO_REGISTRIES_TERRAPHIM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - name: Assert checkout source SHA
        shell: bash
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ needs.preflight.outputs.source_sha }}" ]; then
            echo "ERROR: checkout HEAD $(git rev-parse HEAD) does not match expected source SHA ${{ needs.preflight.outputs.source_sha }}" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install zig
        if: contains(matrix.target, 'apple-darwin') || contains(matrix.target, 'windows')
        shell: bash
        run: |
          if command -v zig &>/dev/null; then exit 0; fi
          if command -v brew &>/dev/null; then brew install zig; fi
          if command -v choco &>/dev/null; then choco install zig -y; fi
      - name: Install cross
        if: matrix.use_cross
        run: |
          if command -v cross &>/dev/null; then
            cross --version
            exit 0
          fi
          rustup run stable cargo install cross --locked --git https://github.com/cross-rs/cross
      - uses: Swatinem/rust-cache@v2
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        with:
          key: clients-${{ matrix.target }}
      - name: Set release version (#67 — binaries must report the tag version)
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          # Bump the workspace version AND terraphim_agent's explicit package
          # version (#95: the agent pins its own version ahead of the
          # workspace) to the release input so CARGO_PKG_VERSION baked into
          # the binaries matches the git tag. Not committed to main (the bump
          # lives only in this CI checkout, like the tag itself).
          python3 - <<'PY'
          import os, pathlib, re, sys

          VERSION = os.environ["VERSION"]

          def set_section_version(path: str, section: str) -> None:
              """Rewrite exactly one `version = "..."` line inside `[section]`."""
              p = pathlib.Path(path)
              text = p.read_text()
              pattern = re.compile(
                  r"(\[" + re.escape(section) + r"\][^\[]*?)"
                  r'version = "[^"]*"',
                  re.S,
              )
              new, count = pattern.subn(r'\g<1>version = "' + VERSION + '"', text)
              if count != 1:
                  sys.exit(
                      f"{path}: expected exactly 1 version line in [{section}], "
                      f"replaced {count}"
                  )
              p.write_text(new)
              print(f"{path}: [{section}] version -> {VERSION}")

          set_section_version("Cargo.toml", "workspace.package")
          set_section_version("crates/terraphim_agent/Cargo.toml", "package")
          PY
          # Assert the release input propagated to every shipped binary crate.
          cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, os, sys
          meta = json.load(sys.stdin)
          want = os.environ["VERSION"]
          versions = {p["name"]: p["version"] for p in meta["packages"]}
          for name in ("terraphim_agent", "terraphim-cli", "terraphim_grep"):
              got = versions.get(name)
              if got != want:
                  sys.exit(f"{name} version is {got!r}, expected {want!r}")
              print(f"{name} {got} OK")
          '
      - name: Assert host binary reports the release version (#67, #95)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          # Build/run on the host (no cross) before the target matrix builds so
          # a version mismatch fails fast. The binary's --version final token
          # must equal the release input exactly.
          out="$(cargo run -q -p terraphim_agent --bin terraphim-agent -- --version)"
          echo "$out"
          reported="$(printf '%s\n' "$out" | tail -n1 | awk '{print $NF}')"
          if [ "$reported" != "$VERSION" ]; then
            echo "ERROR: terraphim-agent --version reported '$reported', expected '$VERSION'" >&2
            exit 1
          fi
      - name: Assert Windows release binary reports the release version (#67, #95, #103)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          # Empirical recovery run 32060761712 proved the release profile alone
          # exits successfully and reports 1.21.12; the historical failure was
          # confined to the debug-profile assertion, not the shipped artifact.
          rustup run stable cargo build --release --target ${{ matrix.target }} -p terraphim_agent --bin terraphim-agent
          out="$(target/${{ matrix.target }}/release/terraphim-agent.exe --version)"
          echo "$out"
          reported="$(printf '%s\n' "$out" | tail -n1 | awk '{print $NF}')"
          if [ "$reported" != "$VERSION" ]; then
            echo "ERROR: terraphim-agent.exe --version reported '$reported', expected \"$VERSION\"" >&2
            exit 1
          fi
      - name: Build client binaries
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            BUILD="rustup run stable cross"
          else
            BUILD="rustup run stable cargo"
          fi
          $BUILD build --release --target ${{ matrix.target }} -p terraphim_agent --bin terraphim-agent
          $BUILD build --release --target ${{ matrix.target }} -p terraphim-cli --bin terraphim-cli
          $BUILD build --release --target ${{ matrix.target }} -p terraphim_grep --bin terraphim-grep --features "code-search openrouter"
      - name: Build client binaries (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          rustup run stable cargo build --release --target ${{ matrix.target }} -p terraphim_agent --bin terraphim-agent
          rustup run stable cargo build --release --target ${{ matrix.target }} -p terraphim-cli --bin terraphim-cli
          rustup run stable cargo build --release --target ${{ matrix.target }} -p terraphim_grep --bin terraphim-grep --features "code-search openrouter"
      - name: Package artifacts (Unix)
        if: matrix.os != 'windows-latest'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/terraphim-agent-${VERSION}-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" terraphim-agent
          tar -czf "artifacts/terraphim-cli-${VERSION}-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" terraphim-cli
          tar -czf "artifacts/terraphim-grep-${VERSION}-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" terraphim-grep
          cp target/${{ matrix.target }}/release/terraphim-agent artifacts/terraphim-agent-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/terraphim-cli artifacts/terraphim-cli-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/terraphim-grep artifacts/terraphim-grep-${{ matrix.target }}
          chmod +x artifacts/*
      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mkdir -p artifacts
          cd "target/${{ matrix.target }}/release"
          7z a -tzip "../../../artifacts/terraphim-agent-${VERSION}-${{ matrix.target }}.zip" terraphim-agent.exe
          7z a -tzip "../../../artifacts/terraphim-cli-${VERSION}-${{ matrix.target }}.zip" terraphim-cli.exe
          7z a -tzip "../../../artifacts/terraphim-grep-${VERSION}-${{ matrix.target }}.zip" terraphim-grep.exe
          cd -
          cp target/${{ matrix.target }}/release/terraphim-agent.exe artifacts/terraphim-agent-${{ matrix.target }}.exe
          cp target/${{ matrix.target }}/release/terraphim-cli.exe artifacts/terraphim-cli-${{ matrix.target }}.exe
          cp target/${{ matrix.target }}/release/terraphim-grep.exe artifacts/terraphim-grep-${{ matrix.target }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: client-binaries-${{ matrix.target }}
          path: artifacts/*

  create-universal-macos:
    name: Create macOS universal client binaries
    needs: [preflight, build-binaries]
    permissions:
      contents: read
    if: >-
      always() &&
      !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.build-binaries.result == 'success'
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-binaries-x86_64-apple-darwin
          path: x86_64
      - uses: actions/download-artifact@v4
        with:
          name: client-binaries-aarch64-apple-darwin
          path: aarch64
      - run: |
          mkdir -p universal
          lipo -create x86_64/terraphim-agent-x86_64-apple-darwin aarch64/terraphim-agent-aarch64-apple-darwin -output universal/terraphim-agent-universal-apple-darwin
          lipo -create x86_64/terraphim-grep-x86_64-apple-darwin aarch64/terraphim-grep-aarch64-apple-darwin -output universal/terraphim-grep-universal-apple-darwin
          chmod +x universal/*
      - uses: actions/upload-artifact@v4
        with:
          name: client-binaries-universal-apple-darwin
          path: universal/*

  sign-and-notarize-macos:
    name: Sign and notarize macOS client binaries
    needs: [preflight, create-universal-macos]
    permissions:
      contents: read
    if: >-
      always() &&
      !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.create-universal-macos.result == 'success'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - name: Assert checkout source SHA
        shell: bash
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ needs.preflight.outputs.source_sha }}" ]; then
            echo "ERROR: checkout HEAD $(git rev-parse HEAD) does not match expected source SHA ${{ needs.preflight.outputs.source_sha }}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: client-binaries-universal-apple-darwin
          path: universal
      - uses: 1password/install-cli-action@v2
      - name: Load signing credentials
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          echo "APPLE_ID=$(op read 'op://TerraphimPlatform/apple.developer.credentials/username' --no-newline)" >> $GITHUB_ENV
          echo "APPLE_TEAM_ID=$(op read 'op://TerraphimPlatform/apple.developer.credentials/APPLE_TEAM_ID' --no-newline)" >> $GITHUB_ENV
          echo "APPLE_APP_PASSWORD=$(op read 'op://TerraphimPlatform/apple.developer.credentials/APPLE_APP_SPECIFIC_PASSWORD' --no-newline)" >> $GITHUB_ENV
          echo "CERT_BASE64=$(op read 'op://TerraphimPlatform/apple.developer.certificate/base64' --no-newline)" >> $GITHUB_ENV
          echo "CERT_PASSWORD=$(op read 'op://TerraphimPlatform/apple.developer.certificate/password' --no-newline)" >> $GITHUB_ENV
      - name: Sign and notarize agent and grep
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          chmod +x scripts/sign-macos-binary.sh
          ./scripts/sign-macos-binary.sh universal/terraphim-agent-universal-apple-darwin "$APPLE_ID" "$APPLE_TEAM_ID" "$APPLE_APP_PASSWORD" "$CERT_BASE64" "$CERT_PASSWORD"
          ./scripts/sign-macos-binary.sh universal/terraphim-grep-universal-apple-darwin "$APPLE_ID" "$APPLE_TEAM_ID" "$APPLE_APP_PASSWORD" "$CERT_BASE64" "$CERT_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: client-binaries-signed-universal-apple-darwin
          path: universal/*

  upload-to-target-release:
    name: Sign + attach to GitHub release + publish to R2
    needs: [preflight, build-binaries, sign-and-notarize-macos]
    # Fail closed: attach only when every build target and macOS signing succeeded.
    if: >-
      always() &&
      !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.sign-and-notarize-macos.result == 'success' &&
      needs.build-binaries.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - name: Assert checkout source SHA
        shell: bash
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ needs.preflight.outputs.source_sha }}" ]; then
            echo "ERROR: checkout HEAD $(git rev-parse HEAD) does not match expected source SHA ${{ needs.preflight.outputs.source_sha }}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: client-binaries-x86_64-unknown-linux-gnu
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: client-binaries-x86_64-unknown-linux-musl
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: client-binaries-aarch64-unknown-linux-musl
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: client-binaries-x86_64-apple-darwin
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: client-binaries-aarch64-apple-darwin
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: client-binaries-x86_64-pc-windows-msvc
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: client-binaries-signed-universal-apple-darwin
          path: release-assets
      - name: Install zipsign
        run: cargo install zipsign --locked
      - name: Sign .tar.gz archives (Ed25519, fail-closed)
        env:
          ZIPSIGN_PRIVATE_KEY: ${{ secrets.ZIPSIGN_PRIVATE_KEY }}
        run: |
          if [ -z "$ZIPSIGN_PRIVATE_KEY" ]; then
            echo "ERROR: ZIPSIGN_PRIVATE_KEY secret not set" >&2; exit 2
          fi
          scripts/sign-release-archives.sh release-assets
      - name: Upload to target GitHub release
        env:
          GH_TOKEN: ${{ secrets.TERRAPHIM_AI_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          TARGET_REPO: ${{ needs.preflight.outputs.target_repo }}
        run: |
          TAG="$RELEASE_TAG"
          REPO="terraphim/$TARGET_REPO"
          find release-assets -type f | sort
          gh release upload "$TAG" release-assets/* --repo "$REPO" --clobber
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Publish signed artifacts + manifest to R2 (#68)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN not set; failing R2 publish closed" >&2; exit 1
          fi
          # Upload each signed archive to r2://terraphim-releases/<bin>/<filename>.
          # (--remote is required: without it wrangler writes to local worker storage
          # and the object is invisible via the downloads.terraphim.ai custom domain.)
          for f in release-assets/*.tar.gz; do
            base="$(basename "$f")"
            # asset filename pattern: <bin>-<version>-<target>.tar.gz
            bin="${base%%-$VERSION-*}"
            bunx wrangler r2 object put "terraphim-releases/${bin}/${base}" --file "$f" --remote
          done
          # Publish manifests LAST (atomicity: never point at a missing asset).
          # One manifest per binary that appears in release-assets.
          bins="$(ls -1 release-assets/*.tar.gz | sed -E "s|^release-assets/||;s/-${VERSION}-.*//" | sort -u)"
          for bin in $bins; do
            scripts/build-manifest.sh "$VERSION" "$bin" release-assets > "/tmp/${bin}.stable.json"
            bunx wrangler r2 object put "terraphim-releases/${bin}/stable.json" \
              --file "/tmp/${bin}.stable.json" --content-type application/json --remote
          done
          # Fail-closed: every published URL must be fetchable.
          for bin in $bins; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://downloads.terraphim.ai/${bin}/stable.json")
            [ "$code" = "200" ] || { echo "manifest $bin returned $code" >&2; exit 1; }
          done
          echo "R2 publish complete; manifests live at https://downloads.terraphim.ai/<bin>/stable.json"
